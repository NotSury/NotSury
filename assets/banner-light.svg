<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Surya Vishnu</title>
  <desc id="desc">Computer Science (Data Science) at Monash University Malaysia. Software Engineering, Backend, Data Science, AI and ML.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="298" rx="16" fill="#ffffff" stroke="#d1d9e0" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="298" rx="16" fill="url(#glow)"/>

  <!-- text -->
  <text x="64" y="92" class="mono" font-size="16" letter-spacing="3" fill="#0d9488">HI, I'M</text>
  <text x="62" y="158" class="sans" font-size="64" font-weight="700" fill="#1f2328">Surya Vishnu</text>
  <text x="64" y="202" class="sans" font-size="22" fill="#59636e">Computer Science (Data Science) · Monash University Malaysia</text>
  <text x="64" y="246" class="mono" font-size="17" fill="#30363d">Software Engineering <tspan fill="#0d9488">/</tspan> Backend <tspan fill="#0d9488">/</tspan> Data Science <tspan fill="#0d9488">/</tspan> AI &amp; ML</text>

  <!-- small network motif -->
  <g stroke="url(#accent)" stroke-width="1.5" stroke-opacity="0.35" fill="none">
    <path d="M900 90 L1000 70 M900 90 L1000 130 M900 90 L1000 190 M900 90 L1000 240"/>
    <path d="M900 160 L1000 70 M900 160 L1000 130 M900 160 L1000 190 M900 160 L1000 240"/>
    <path d="M900 230 L1000 70 M900 230 L1000 130 M900 230 L1000 190 M900 230 L1000 240"/>
    <path d="M1000 70 L1100 120 M1000 130 L1100 120 M1000 190 L1100 120 M1000 240 L1100 120"/>
    <path d="M1000 70 L1100 190 M1000 130 L1100 190 M1000 190 L1100 190 M1000 240 L1100 190"/>
  </g>
  <g fill="#ffffff" stroke-width="2.5">
    <circle cx="900" cy="90" r="9" stroke="#0d9488"/>
    <circle cx="900" cy="160" r="9" stroke="#0d9488"/>
    <circle cx="900" cy="230" r="9" stroke="#0d9488"/>
    <circle cx="1000" cy="70" r="9" stroke="#1a7cb8"/>
    <circle cx="1000" cy="130" r="9" stroke="#1a7cb8"/>
    <circle cx="1000" cy="190" r="9" stroke="#1a7cb8"/>
    <circle cx="1000" cy="240" r="9" stroke="#1a7cb8"/>
    <circle cx="1100" cy="120" r="9" stroke="#2563eb"/>
    <circle cx="1100" cy="190" r="9" stroke="#2563eb"/>
  </g>

  <rect x="64" y="270" width="120" height="3" rx="1.5" fill="url(#accent)"/>
